title: Claude Code on Windows
description: 30-minute mentorship playbook for non-developers — install, demo, attendee handout.

theme: just-the-docs

plugins:
  - jekyll-seo-tag

color_scheme: light
search_enabled: true
heading_anchors: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - build-pdfs.ps1
  - marked.min.js
  - edge-temp/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
  - README.md
  - 01-walkthrough.md
  - 02-outline.md
  - 03-handout.md
  - pdfs/
