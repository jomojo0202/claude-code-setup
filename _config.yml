title: Claude Code on Windows
description: 30-minute mentorship playbook for non-developers — install, demo, attendee handout.

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  "View on GitHub":
    - "https://github.com/jomojo0202/claude-code-setup"
  "Download PDFs":
    - "https://github.com/jomojo0202/claude-code-setup/tree/main/pdfs"

aux_links_new_tab: true

footer_content: "Built for an instructor-led 30-minute mentorship session. <a href=\"https://github.com/jomojo0202/claude-code-setup\">Source on GitHub</a>."

# Don't include build artifacts on the site
exclude:
  - build-pdfs.ps1
  - "*.html"
  - marked.min.js
  - edge-temp/
  - Gemfile
  - Gemfile.lock
